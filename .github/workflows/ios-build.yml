name: iOS Cloud Build & IPA Packaging

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build iOS No-Codesign Release (.app bundle)
        run: flutter build ios --release --no-codesign

      - name: Compress Payload for Testing (.zip)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r UGCULT_iOS_Release.zip Payload
        shell: bash

      - name: Upload iOS Payload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: UGCULT_iOS_Release.zip
