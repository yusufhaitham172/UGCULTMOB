name: ugcult
description: "UGCULT - Production Mobile App (iOS Target & Android Cross-Platform)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Backend & Network
  supabase_flutter: ^2.8.4

  # Secure Storage & Cache
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1

  # UI & Design System
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Crash Reporting & Logging
  sentry_flutter: ^8.14.2

  # Utilities & Serialization
  intl: ^0.20.2
  uuid: ^4.5.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
